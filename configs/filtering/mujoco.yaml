# Trajectory filter configuration: MuJoCo backend.
#
# MuJoCo trajectories are materially different from the fake test double:
# measured on the same seeds, clean-successful median dimensionless jerk is
# 2.47e6 (MuJoCo) vs 6.62e6 (fake), and median SPARC is -3.20 vs -3.76. The
# thresholds below are therefore derived independently; one number is not forced
# onto both backends.
#
# collision rule (re-derived 2026-11-02, Task 6b): the new contact classifier
# counts cube<->cube, hand<->cube, finger<->table, and finger<->non-target-cube
# contacts. Clean successful MuJoCo tuning episodes still have 0-3 unintended
# runs (0:3, 1:30, 2:12, 3:2; p95=2), so the p95 x 1.2 rule gives ceil(2.4)=3.
# This is a derived upper bound, not the old "any contact" bug workaround.
schema_version: 1
sim_config: ../sim/panda.yaml

validation:
  min_steps: 20
  dt_jitter_tolerance_s: 0.005
  min_path_length_m: 0.01
  derivative_method: savgol
  savgol_window: 9
  savgol_polyorder: 5

metrics:
  sparc:
    f_c_hz: 10.0
    nyquist_fraction: 0.8
    padlevel: 4
    amplitude_threshold: 0.05

hard_gates:
  require_success: true
  max_collisions: 3
  min_joint_margin: 0.0
  min_velocity_margin: 0.0

# Threshold rule (tuning set: seeds 1000-1099, 40% perturbed):
#   clean + successful + non-perturbed, n=47; p95 * 1.2 for upper bounds and
#   p5 - 0.3 (more negative) for SPARC. Never chosen from the hold-out set.
# Supersedes the Task 5 values (jerk 4062840, sparc -4.16341, path 1.15026).
soft_thresholds:
  max_dimensionless_squared_jerk: 8637545.0
  min_sparc: -4.53250
  max_path_length_m: 1.31059

weights:
  dimensionless_squared_jerk: 0.4
  sparc: 0.4
  path_length_m: 0.2

accept_score_threshold: 0.5
