# Franka Emika Panda model and canonical ROS names.
#
# The MJCF comes from MuJoCo Menagerie at a pinned commit (see
# assets/mujoco/ATTRIBUTION.md). Upstream calls the joints joint1..joint7 and
# the bodies link0..hand; the backend maps them to the canonical panda_* names
# in src/sim2real/contracts.py. `model` is relative to this file.
schema_version: 1

model: ../../assets/mujoco/scene_tabletop.xml

joint_names:
  [panda_joint1, panda_joint2, panda_joint3, panda_joint4,
   panda_joint5, panda_joint6, panda_joint7]

mujoco_joint_names:
  [joint1, joint2, joint3, joint4, joint5, joint6, joint7]

gripper_joint: panda_finger_joint1
mujoco_gripper_joint: finger_joint1

# Metres; the Menagerie two-finger gripper opens from 0 to 0.04.
gripper_limits: [0.0, 0.04]
home_gripper: 0.04

home_arm: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]

# Cross-checked against the loaded MJCF by tests/test_backend_contract.py.
joint_limits:
  - [-2.8973, 2.8973]
  - [-1.7628, 1.7628]
  - [-2.8973, 2.8973]
  - [-3.0718, -0.0698]
  - [-2.8973, 2.8973]
  - [-0.0175, 3.7525]
  - [-2.8973, 2.8973]

# Tool centre point in the hand body frame (metres).
tcp_offset: [0.0, 0.0, 0.1]

body_frames:
  - {ros: panda_link0, mujoco: link0}
  - {ros: panda_link1, mujoco: link1}
  - {ros: panda_link2, mujoco: link2}
  - {ros: panda_link3, mujoco: link3}
  - {ros: panda_link4, mujoco: link4}
  - {ros: panda_link5, mujoco: link5}
  - {ros: panda_link6, mujoco: link6}
  - {ros: panda_link7, mujoco: link7}
  - {ros: panda_hand, mujoco: hand}
