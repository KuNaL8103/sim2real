# SmolVLA + PEFT LoRA overfit protocol, 2,000-step follow-up (remote overfit analysis).
#
# Identical to smolvla_lora_overfit_remote.yaml except training.max_steps:
# 1,000 -> 2,000. One change only, per the pre-registered interpretation table
# ("more steps (1,000 -> 2,000 at the same batch/lr)").
#
# Why: the remote overfit bias/spread analysis measured teacher-forced first-step arm
# L1 of 0.0748 (step 200), 0.0472 (500) and 0.0329 (1,000) on the same frames
# and seeds; the error is still falling, but the 100-step block mean training
# loss flattened from 0.232 (801-900) to 0.234 (901-1000). Extrapolating the
# measured per-doubling decay of the gap (~0.70) gives an ESTIMATE of about
# 0.023 single-sample L1 at 2,000 steps, i.e. probably still above the
# pre-registered 0.010 bar. This run tests whether optimization budget is the
# limiter before any rank or learning-rate change.
#
# Wall time is an estimate from the T4 run's measured 1.21 s/step:
# 2,000 x 1.21 s = 2,420 s = 40.3 min of compute, plus model load and
# checkpoint writes. T4 clocks vary; this is not a guarantee.
#
# The pre-registered decision rule (configs/evaluation/overfit_rule.yaml and
# docs/TRAINING.md section 17) is unchanged.
#
# Same two train-v1 episodes (dataset indices 0 and 1; episode seeds 10000 and
# 10004), same LoRA (r 32, alpha 64, dropout 0.05), same constant lr 1e-4,
# batch 4, fp32. Checkpoints every 100 steps therefore include 100 ... 2,000.
#
# Verified against LeRobot 0.6.1 and lerobot/smolvla_base revision
# 5e8d12a6e2975b0e5e5fce7c8caf47c371d257b6. Two cameras: overhead -> camera1,
# wrist -> camera2; camera3 is intentionally absent (empty_cameras stays 0).
schema_version: 1
model:
  family: smolvla
  checkpoint: lerobot/smolvla_base
  revision: 5e8d12a6e2975b0e5e5fce7c8caf47c371d257b6
  expected_cameras:
    - observation.images.camera1
    - observation.images.camera2
  validated: true
  max_state_dim: 32
  max_action_dim: 32
  empty_cameras: 0
lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - '(model\.vlm_with_expert\.lm_expert\..*\.(q|v)_proj|model\.(state_proj|action_in_proj|action_out_proj|action_time_mlp_in|action_time_mlp_out))'
  bias: none
  method_type: LORA
  init_type: null
data:
  dataset_root: data/lerobot/train_v1
  # Explicit training subset: dataset indices 0 and 1 (seeds 10000 and 10004).
  episode_indices: [0, 1]
  val_fraction: 0.2
  split_seed: 123
  exclude_perturbed: false
  mixture_path: null
  rename_map:
    observation.images.overhead: observation.images.camera1
    observation.images.wrist: observation.images.camera2
  action_representation: joint_position
  decimation: 2
  fps: 10.0
training:
  smoke_test: false
  max_steps: 2000
  batch_size: 4
  seed: 0
  lr: 0.0001
  grad_accum: 1
  precision: fp32
  gradient_checkpointing: false
  save_every: 100
  num_workers: 0
  deterministic: true
  chunk_size: 50
  n_action_steps: 50
tracking:
  backend: none
  offline: true
