# Embodiment declarations for the Task 7 dataset builder.
#
# fps is always derived as control_rate_hz / decimation.  The Panda dataset
# therefore runs at 10 Hz when the default image decimation is 2; state, action,
# and images are subsampled at the same steps.
schema_version: 1

embodiments:
  panda_sim:
    robot_type: franka_panda
    control_rate_hz: 20.0
    decimation: 2
    state:
      dtype: float32
      names:
        - panda_joint1
        - panda_joint2
        - panda_joint3
        - panda_joint4
        - panda_joint5
        - panda_joint6
        - panda_joint7
        - panda_finger_joint1
      units: [rad, rad, rad, rad, rad, rad, rad, m]
      # TrajectoryStep.gripper_position is the measured finger opening in
      # metres (0 = closed, 0.04 = open in configs/expert/default.yaml).
      frame: "panda joints and panda_finger_joint1; gripper opening in m"
    actions:
      joint_position:
        dim: 8
        dtype: float32
        units: [rad, rad, rad, rad, rad, rad, rad, m]
        frame: "absolute panda_joint1..7 targets + absolute gripper target in m"
      ee_delta:
        dim: 7
        dtype: float32
        units: [m, m, m, rad, rad, rad, unitless]
        frame: "world axes at the recorded panda_hand pose; rotation vector of R[t+1] R[t]^-1"
        normalized_gripper: true
    cameras: [overhead, wrist]
    gripper:
      open_m: 0.04
      closed_m: 0.0
    license_tag: Apache-2.0
    notes: "Synthetic Franka Panda data generated by this repository."

  widowx_bridge:
    robot_type: widowx_250
    control_rate_hz: 5.0
    decimation: 1
    state:
      dtype: float32
      names: [x, y, z, roll, pitch, yaw, gripper]
      units: [m, m, m, rad, rad, rad, unitless]
      # Bridge stores the EEF pose in the collection/controller frame and rpy
      # relative to the controller's default rotation.  The primary source does
      # not independently document a base-frame-vs-world-frame transform here;
      # do not guess one.
      frame: "Bridge EEF pose; xyz/rpy in the collection frame, rpy relative to the default rotation"
    actions:
      bridge_ee_delta:
        dim: 7
        dtype: float32
        units: [m, m, m, rad, rad, rad, unitless]
        frame: "world axes at the current EEF; xyz delta and rpy delta about the EEF position"
    cameras: [third_person, side_1, side_2, wrist]
    gripper:
      open_m: 1.0
      closed_m: 0.0
    license_tag: CC-BY-4.0
    notes: >-
      Open X-Embodiment `bridge` (BridgeData V2). 1000 controller units are not
      converted here; the gripper channel is kept as recorded. Bridge is an
      auxiliary source, not a performance claim.
