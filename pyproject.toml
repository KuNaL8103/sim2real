[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sim2real"
version = "0.1.0"
description = "End-to-end sim2real robotics data pipeline and VLA fine-tuning framework."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kunal", email = "kunaldabbe2003@gmail.com" }]
keywords = ["robotics", "ros2", "sim2real", "mujoco", "vla", "lerobot"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[dependency-groups]
# Small, pure-Python dev/test dependencies. Installed by `uv sync`.
dev = [
  "hydra-core>=1.3,<2",
  "numpy>=1.26",
  "omegaconf>=2.3,<3",
  "pyyaml>=6,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9",
]
# Declared but intentionally empty. Populated only when the matching
# environment is approved; these are NOT installed by `uv sync`.
sim = [
    "mujoco>=3.17.0",
]
ml = []

[tool.hatch.build.targets.wheel]
packages = ["src/sim2real"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "ros2_ws/src"]
exclude = [".venv", ".venv-ros", ".venv-ml", "build", "install", "log", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# sim_node bootstraps src/ and .venv-ros before importing sim2real/mujoco.
"ros2_ws/src/sim2real_sim/sim2real_sim/sim_node.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests", "ros2_ws/src"]
addopts = "-ra --strict-markers --import-mode=importlib -p no:launch_testing -p no:launch_ros"
markers = [
  "ros: requires a sourced ROS 2 Jazzy environment and built interfaces",
  "sim: requires a simulator backend",
  "render: requires rendering support (possibly GPU)",
  "gpu: requires an NVIDIA GPU",
  "slow: long-running test",
  "integration: crosses package or process boundaries",
]
